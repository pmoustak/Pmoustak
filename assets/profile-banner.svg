<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">M.PERI Dragon Ball developer banner</title>
  <desc id="desc">A subtle Dragon Radar, Nimbus cloud, glowing M.PERI wordmark, and orange four-star Dragon Ball.</desc>
  <defs>
    <radialGradient id="radarGlass" cx="42%" cy="36%">
      <stop offset="0%" stop-color="#237d48"/>
      <stop offset="100%" stop-color="#174b32"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="28%">
      <stop offset="0%" stop-color="#ffe88a"/>
      <stop offset="48%" stop-color="#f5a83a"/>
      <stop offset="100%" stop-color="#c9672f"/>
    </radialGradient>
    <filter id="warmGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#e89b45" flood-opacity=".55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="radarClip"><circle cx="125" cy="151" r="53"/></clipPath>
    <path id="star" d="M0,-12 L3.5,-4 L12,-3.5 L5.5,2 L7.5,10 L0,5.5 L-7.5,10 L-5.5,2 L-12,-3.5 L-3.5,-4 Z"/>
  </defs>

  <!-- Dragon Radar -->
  <g transform="translate(0 0)">
    <circle cx="125" cy="151" r="66" fill="#273a36" stroke="#aab4a2" stroke-width="7"/>
    <circle cx="125" cy="151" r="56" fill="url(#radarGlass)" stroke="#d2c59a" stroke-width="2"/>
    <g clip-path="url(#radarClip)" stroke="#71b56d" stroke-opacity=".72" stroke-width="2">
      <path d="M72 122h106M69 141h112M69 161h112M74 180h102"/>
      <path d="M95 95l47 111M118 92l48 113M145 95L99 207M168 105l-49 101"/>
      <circle cx="125" cy="151" r="28" fill="none"/>
      <circle cx="125" cy="151" r="48" fill="none"/>
      <path d="M125 96v110M70 151h110"/>
    </g>
    <circle cx="139" cy="164" r="7" fill="#ee6c3d" stroke="#332b22" stroke-width="3"/>
    <path d="M95 78c-1-17 11-29 28-30h11c18 1 28 13 28 29v11H95z" fill="#8da6a5" stroke="#293834" stroke-width="6"/>
    <ellipse cx="111" cy="81" rx="11" ry="17" fill="#a9c1bf" stroke="#293834" stroke-width="5"/>
  </g>

  <!-- Nimbus cloud -->
  <g transform="translate(260 146)" fill="#e5c46e" stroke="#4e4833" stroke-width="4" stroke-linejoin="round">
    <path d="M-70 9c-15-2-24-13-21-26 3-12 14-19 27-17 1-18 16-30 34-27 12 2 21 10 25 21 15-9 35-4 42 12 4 9 3 19-2 27 12 2 20 11 20 22 0 14-11 24-26 24h-94c-14 0-25-8-25-20 0-7 8-14 20-16z"/>
    <path d="M-60 15c-17 19-26 31-44 42 22-4 43-18 58-33" fill="none"/>
    <path d="M-40 -15c6-8 18-8 23 0M16-6c6-7 17-7 22 1" fill="none" stroke="#9c7438" stroke-width="3" opacity=".75"/>
  </g>

  <!-- Wordmark -->
  <text x="635" y="174" text-anchor="middle" font-family="Courier New, monospace" font-size="88" font-weight="700" letter-spacing="8" fill="#f4dda3" stroke="#463628" stroke-width="5" paint-order="stroke" filter="url(#warmGlow)">M.PERI</text>
  <path d="M475 207h320" stroke="#a87440" stroke-width="2" opacity=".7"/>
  <circle cx="459" cy="207" r="3" fill="#89a36e"/>
  <circle cx="811" cy="207" r="3" fill="#89a36e"/>

  <!-- Four-star Dragon Ball -->
  <g>
    <circle cx="1036" cy="151" r="82" fill="url(#ball)" stroke="#493a2a" stroke-width="8"/>
    <circle cx="1036" cy="151" r="73" fill="none" stroke="#ffe7a2" stroke-opacity=".55" stroke-width="2"/>
    <path d="M984 107c13-18 34-29 56-31" fill="none" stroke="#fff0bc" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <g fill="#a94d2f" stroke="#f8d77e" stroke-width="1.5">
      <use href="#star" transform="translate(1012 126) scale(.72)"/>
      <use href="#star" transform="translate(1058 126) scale(.72)"/>
      <use href="#star" transform="translate(1012 171) scale(.72)"/>
      <use href="#star" transform="translate(1058 171) scale(.72)"/>
    </g>
  </g>
</svg>