<svg xmlns="http://www.w3.org/2000/svg" width="430" height="120" viewBox="0 0 430 120" role="img" aria-labelledby="title desc">
  <title id="title">M.PERI — cozy Dragon Ball graffiti</title>
  <desc id="desc">A warm graffiti wordmark with the original four-star Dragon Ball cursor artwork glowing beside it.</desc>
  <defs>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#e59642" flood-opacity=".72"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ballGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Cozy moss and rust paint strokes -->
  <path d="M34 93c50 12 147 14 244 0" fill="none" stroke="#75825a" stroke-width="4" stroke-linecap="round"/>
  <path d="M47 27c20-8 39-10 55-8M237 20l17-7" fill="none" stroke="#bc7440" stroke-width="3" stroke-linecap="round"/>
  <circle cx="29" cy="43" r="2.5" fill="#bc7440"/>
  <circle cx="263" cy="35" r="2" fill="#75825a"/>
  <circle cx="245" cy="101" r="2.5" fill="#bc7440"/>
  <path d="M77 96v7m8-6v4m145-7v6" stroke="#bc7440" stroke-width="2" stroke-linecap="round"/>

  <!-- Slightly tilted, outlined graffiti wordmark -->
  <g transform="rotate(-3 151 61)">
    <text x="155" y="73" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="51" font-weight="900" font-style="italic" letter-spacing="1" fill="#60704d" stroke="#493526" stroke-width="7" stroke-linejoin="round" paint-order="stroke">M.PERI</text>
    <text x="151" y="68" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="51" font-weight="900" font-style="italic" letter-spacing="1" fill="#f4d99c" stroke="#493526" stroke-width="5" stroke-linejoin="round" paint-order="stroke" filter="url(#glow)">M.PERI</text>
    <path d="M40 80c54 8 139 8 222-1" fill="none" stroke="#d58a45" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Soft halo behind the user's original four-star cursor art -->
  <circle cx="356" cy="60" r="43" fill="#f2a64a" opacity=".55" filter="url(#ballGlow)"/>
  <image x="311" y="15" width="90" height="90" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>
</svg>